<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1d20">
<meta name="description" content="Бесплатный фоторедактор: слои, кисти, штамп, выделение, коррекция и фильтры. Работает без интернета.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ретушь">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{color-scheme:dark}body{margin:0}#app{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Ретушь</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600&family=JetBrains+Mono:wght@400;500&family=Lobster&family=Oswald:wght@500;700&family=Pacifico&family=Rubik:wght@400;700&display=swap">
<style>
/* Layout: darkroom workbench. Menu + options strip on top, tool rail left, dark light-table centre, panels right, status line bottom. Single deliberate dark theme (neutral greys keep photo colours honest). */
:root{
  --bg:#1b1d20; --panel:#232629; --raised:#2e3236; --line:#3a3f45; --fg:#e8e6e1; --muted:#9ba0a7;
  --accent:#f2a541; --accent-ink:#1b1d20; --table:#121315; --danger:#ea6b5c;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--f-ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
kbd{font:500 11px/1 var(--f-mono);background:var(--raised);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:3px 5px;color:var(--fg);white-space:nowrap}
#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* menu bar */
#menubar{display:flex;align-items:center;gap:6px;height:40px;border-bottom:1px solid var(--line);min-width:0}
.logo{font:600 15px/1 var(--f-display);letter-spacing:.02em;padding-right:10px;color:var(--fg);white-space:nowrap}
.logo span{color:var(--accent)}
#menus{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none}
#menus::-webkit-scrollbar{display:none}
.mbtn{background:none;border:0;padding:6px 9px;border-radius:5px;white-space:nowrap}
.mbtn:hover,.mbtn.open{background:var(--raised)}
.spacer{flex:1}
.cta{display:flex;gap:6px;flex-shrink:0}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:5px 11px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:none}
#panelsBtn{display:none}
.dropdown{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px;min-width:270px;box-shadow:0 12px 32px rgba(0,0,0,.5);max-height:80vh;overflow-y:auto}
.dropdown button{display:flex;width:100%;justify-content:space-between;gap:18px;align-items:center;background:none;border:0;padding:6px 9px;border-radius:5px;text-align:left}
.dropdown button:hover{background:var(--raised)}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.dropdown .head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 9px 3px}

/* options bar */
#optbar{display:flex;align-items:center;gap:14px;height:42px;border-bottom:1px solid var(--line);overflow-x:auto;min-width:0;white-space:nowrap}
#toolName{font-weight:600;color:var(--accent);flex-shrink:0}
#opts{display:flex;align-items:center;gap:16px}
.opt{display:flex;align-items:center;gap:7px;color:var(--muted)}
.opt input[type=range]{width:110px;accent-color:var(--accent)}
.opt output{font:12px var(--f-mono);color:var(--fg);min-width:52px}
.opt select{background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.opt input[type=checkbox]{accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 9px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--raised);color:var(--fg)}

/* main */
#main{display:grid;grid-template-columns:auto minmax(0,1fr) 276px;min-height:0;position:relative}
#app.nopanels #main{grid-template-columns:auto minmax(0,1fr)}
#app.nopanels #panel{display:none}
#toolbar{display:flex;flex-direction:column;gap:2px;padding:8px 6px 8px 0;overflow-y:auto;scrollbar-width:none;border-right:1px solid var(--line)}
#toolbar::-webkit-scrollbar{display:none}
.tool{width:36px;height:34px;flex-shrink:0;display:grid;place-items:center;background:none;border:0;border-radius:6px;color:var(--muted);position:relative}
.tool:hover{background:var(--raised);color:var(--fg)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool .k{position:absolute;right:2px;bottom:1px;font:9px/1 var(--f-mono);opacity:.6}
.tsep{height:1px;background:var(--line);margin:4px 4px;flex-shrink:0}
.colors{position:relative;width:36px;height:40px;margin-top:8px;flex-shrink:0}
.sw{position:absolute;width:22px;height:22px;border:2px solid var(--fg);border-radius:4px;padding:0;box-shadow:0 0 0 1px #000}
.sw.fg{left:1px;top:1px;z-index:2}.sw.bg{left:13px;top:14px}
.minibtn{background:none;border:0;color:var(--muted);font-size:11px;padding:2px;flex-shrink:0}
.minibtn:hover{color:var(--fg)}
#tip{position:fixed;z-index:60;background:#0d0e10;border:1px solid var(--line);border-radius:7px;padding:8px 10px;max-width:280px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tip b{display:flex;gap:8px;align-items:center;margin-bottom:3px}
#tip p{margin:0;color:var(--muted);font-size:12px}

#viewport{position:relative;overflow:hidden;background:var(--table);touch-action:none;min-width:0}
#board{position:absolute;left:0;top:0;transform-origin:0 0;background:repeating-conic-gradient(#3b3e43 0 25%,#2c2f33 0 50%) 0 0/16px 16px}
#view{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
#textEdit{position:absolute;background:rgba(0,0,0,.12);border:0;outline:1px dashed var(--accent);padding:0;margin:0;resize:none;overflow:hidden;white-space:pre;line-height:1.2;min-width:40px}
#drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;display:grid;place-items:center;background:rgba(18,19,21,.8);font-size:16px;pointer-events:none}

/* panels */
#panel{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.pane{padding:10px 0 10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-height:0}
.pane h2{margin:0;font:600 11px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.pane.grow{flex:1}
.pane.hist{max-height:30%}
.hexrow{display:flex;gap:8px;align-items:center}
.hexrow input{width:90px;background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font:12px var(--f-mono)}
.chip{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);padding:0;flex-shrink:0}
.palette{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.palette button{aspect-ratio:1;border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:0;max-width:100%}
.lctl{display:flex;gap:8px;align-items:center;color:var(--muted)}
.lctl select{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
.lctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.lctl output{font:12px var(--f-mono);color:var(--fg);width:40px;text-align:right}
#layers{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:80px;display:flex;flex-direction:column;gap:2px}
#layers li{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
#layers li:hover{background:var(--panel)}
#layers li.on{background:var(--raised);border-color:var(--line)}
#layers li.hid{opacity:.5}
.eye{background:none;border:0;padding:2px;color:var(--muted);display:grid}
.eye svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}
.thumb{width:44px;height:33px;flex-shrink:0;border:1px solid var(--line);background:repeating-conic-gradient(#3b3e43 0 25%,#2c2f33 0 50%) 0 0/8px 8px}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname input{width:100%;background:var(--bg);border:1px solid var(--accent);border-radius:4px;padding:1px 4px}
.lbtns{display:flex;gap:4px;flex-wrap:wrap}
.lbtns button{background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:12px}
.lbtns button:hover{border-color:var(--muted)}
.lbtns button:disabled{opacity:.4;cursor:default}
#history{list-style:none;margin:0;padding:0;overflow-y:auto;font-size:12px}
#history li{padding:4px 8px;border-radius:5px;cursor:pointer;display:flex;gap:8px}
#history li:hover{background:var(--panel)}
#history li.on{background:var(--raised);color:var(--accent)}
#history li.future{color:var(--muted);opacity:.55}
#history li span{font:11px var(--f-mono);color:var(--muted);width:20px}

/* status */
#status{display:flex;align-items:center;gap:14px;height:30px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);min-width:0}
#hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
#coords,#docsize{font-family:var(--f-mono);white-space:nowrap}
.zoom{display:flex;align-items:center;gap:2px}
.zoom button{background:none;border:0;padding:2px 7px;border-radius:4px;color:var(--fg)}
.zoom button:hover{background:var(--raised)}
#zoomLbl{font-family:var(--f-mono);min-width:52px;text-align:center;color:var(--fg)}

/* modal */
#modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(400px,100%);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto}
.dlg h3{margin:0;font:600 15px/1.2 var(--f-display);letter-spacing:.01em}
.dlg p{margin:0;color:var(--muted);font-size:12.5px}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr) 62px;gap:10px;align-items:center}
.frow.wide{grid-template-columns:120px minmax(0,1fr)}
.frow label{color:var(--muted)}
.frow input[type=range]{width:100%;accent-color:var(--accent)}
.frow input[type=number],.frow select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.frow input.num{font:12px var(--f-mono)}
.fchk{display:flex;gap:8px;align-items:center;color:var(--fg)}
.fchk input{accent-color:var(--accent)}
.dbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.hist-canvas{width:100%;height:70px;background:var(--bg);border-radius:6px;border:1px solid var(--line)}

/* keys overlay */
#keys{position:fixed;inset:0;z-index:80;background:rgba(10,11,12,.86);overflow-y:auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.keys-in{max-width:1100px;margin:0 auto}
.keys-top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.keys-top h2{margin:0;font:600 20px/1.2 var(--f-display);flex:1}
.keys-top input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:220px;max-width:100%}
.kgrid{columns:3 300px;column-gap:28px}
.kgroup{break-inside:avoid;margin-bottom:22px}
.kgroup h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.krow{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.krow span:first-child{color:var(--fg)}

#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:90;background:#0d0e10;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:9px 14px;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.5)}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}

@media (max-width:900px){
  #main{grid-template-columns:auto minmax(0,1fr)}
  #panel{position:absolute;right:0;top:0;bottom:0;width:min(290px,85%);z-index:30;display:none;box-shadow:-10px 0 30px rgba(0,0,0,.5)}
  #app.showpanels #panel{display:flex}
  #panelsBtn{display:inline-block}
  #coords,#docsize,.helpk{display:none}
  .cta .btn.ghost{display:none}
}
@media (max-width:560px){ .logo{display:none} .cta .btn{padding:5px 9px} #hint{font-size:11px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header id="menubar">
    <div class="logo">Рету<span>ш</span>ь</div>
    <nav id="menus" aria-label="Меню"></nav>
    <div class="spacer"></div>
    <div class="cta">
      <button class="btn ghost" id="helpBtn" type="button">Клавиши <kbd class="helpk">F1</kbd></button>
      <button class="btn" id="openBtn" type="button">Открыть фото</button>
      <button class="btn primary" id="saveBtn" type="button">Сохранить</button>
      <button class="btn" id="panelsBtn" type="button">Слои</button>
      <button class="btn primary" id="installBtn" type="button" hidden>Установить</button>
    </div>
  </header>
  <div id="optbar"><span id="toolName"></span><div id="opts"></div></div>
  <main id="main">
    <div id="toolbar" role="toolbar" aria-label="Инструменты"></div>
    <div id="viewport">
      <div id="board"><canvas id="view"></canvas></div>
      <canvas id="overlay"></canvas>
      <textarea id="textEdit" hidden spellcheck="false" aria-label="Текст надписи"></textarea>
      <div id="drop" hidden>Отпустите файл, чтобы открыть</div>
    </div>
    <aside id="panel">
      <section class="pane">
        <h2>Цвет</h2>
        <div class="hexrow"><button class="chip" id="fgChip" type="button" title="Основной цвет"></button><input id="hexIn" maxlength="7" aria-label="HEX основного цвета"><button class="chip" id="bgChip" type="button" title="Фоновый цвет"></button></div>
        <div class="palette" id="palette"></div>
      </section>
      <section class="pane grow">
        <h2>Слои</h2>
        <div class="lctl"><select id="blendSel" aria-label="Режим наложения"></select></div>
        <div class="lctl">Непрозр.<input type="range" id="lopIn" min="0" max="100" aria-label="Непрозрачность слоя"><output id="lopOut"></output></div>
        <ul id="layers"></ul>
        <div class="lbtns">
          <button type="button" id="lNew" title="Новый слой (Shift+N)">+ Слой</button>
          <button type="button" id="lDup" title="Дублировать (Ctrl+J)">Копия</button>
          <button type="button" id="lUp" title="Выше (Ctrl+])">↑</button>
          <button type="button" id="lDown" title="Ниже (Ctrl+[)">↓</button>
          <button type="button" id="lMerge" title="Объединить с нижним (Ctrl+E)">Слить</button>
          <button type="button" id="lDel" title="Удалить слой">Удалить</button>
        </div>
      </section>
      <section class="pane hist">
        <h2>История</h2>
        <ol id="history"></ol>
      </section>
    </aside>
  </main>
  <footer id="status">
    <span id="hint"></span>
    <span id="coords"></span>
    <span id="docsize"></span>
    <div class="zoom"><button type="button" id="zOut" aria-label="Уменьшить">−</button><span id="zoomLbl">100%</span><button type="button" id="zIn" aria-label="Увеличить">+</button><button type="button" id="zFit">Вписать</button></div>
  </footer>
</div>

<div id="modal" hidden><form class="dlg" id="dlgForm"></form></div>
<div id="keys" hidden><div class="keys-in"><div class="keys-top"><h2>Горячие клавиши</h2><input id="kfilter" placeholder="Найти: кисть, слой, отменить…" aria-label="Поиск по клавишам"><button class="btn" type="button" id="kclose">Закрыть (Esc)</button></div><div class="kgrid" id="kgrid"></div></div></div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="fileIn" class="vh" accept="image/*,.json,application/json" tabindex="-1">
<input type="color" id="colorIn" class="vh" tabindex="-1">

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
const fmtKey=k=>k.replace(/Ctrl\+=/,'Ctrl++').replace(/Ctrl/g,isMac?'⌘':'Ctrl').replace(/Alt/g,isMac?'⌥':'Alt');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pct=v=>Math.round(v*100)+' %';
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}
const cx=c=>c.getContext('2d');
function clone(c){const n=mk(c.width,c.height);cx(n).drawImage(c,0,0);return n;}
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){if(k==='on')for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else if(k==='text')e.textContent=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k]);}kids.flat().forEach(k=>k!=null&&e.append(k));return e;}

/* ===== document state ===== */
const S={w:1200,h:800,layers:[],active:0,sel:null};
let uid=1, selPath=null, docName='retush';
const newLayer=name=>({id:uid++,name,visible:true,opacity:1,blend:'source-over',canvas:mk(S.w,S.h)});
const AL=()=>S.layers[S.active];
function edit(l=AL()){l.canvas=clone(l.canvas);return cx(l.canvas);} // copy-on-write keeps history snapshots intact

/* ===== history ===== */
const H={list:[],i:-1};
function snap(label){
  H.list=H.list.slice(0,H.i+1);
  H.list.push({label,w:S.w,h:S.h,active:S.active,sel:S.sel,layers:S.layers.map(l=>({...l}))});
  if(H.list.length>50)H.list.shift();
  H.i=H.list.length-1; updateLayersUI(); updateHistoryUI();
}
function restore(e){
  const resized=e.w!==S.w||e.h!==S.h;
  S.w=e.w;S.h=e.h;S.active=e.active;S.layers=e.layers.map(l=>({...l}));
  setSel(e.sel); if(resized){onDocResize();fit();} render(); updateLayersUI(); updateHistoryUI();
}
function undo(){if(H.i>0){H.i--;restore(H.list[H.i]);toast('Отменено: '+H.list[H.i+1].label,1400);}}
function redo(){if(H.i<H.list.length-1){H.i++;restore(H.list[H.i]);toast('Повторено: '+H.list[H.i].label,1400);}}

/* ===== view ===== */
const vp=$('#viewport'), board=$('#board'), view=$('#view'), vctx=cx(view), ov=$('#overlay'), octx=cx(ov), textEdit=$('#textEdit');
let Z=1,PX=0,PY=0,dpr=1;
function onDocResize(){view.width=S.w;view.height=S.h;board.style.width=S.w+'px';board.style.height=S.h+'px';$('#docsize').textContent=S.w+' × '+S.h+' px';render();}
function applyView(){
  board.style.transform=`translate(${PX}px,${PY}px) scale(${Z})`;
  board.style.backgroundSize=`${16/Z}px ${16/Z}px`;
  view.style.imageRendering=Z>=2?'pixelated':'auto';
  $('#zoomLbl').textContent=(Z>=1?Math.round(Z*100):(Z*100).toFixed(Z<.1?1:0))+'%';
  if(TX.active)placeText(); drawOverlay();
}
function vpRect(){return vp.getBoundingClientRect();}
function fit(){const r=vpRect();if(!r.width)return;Z=Math.min((r.width-48)/S.w,(r.height-48)/S.h);Z=clamp(Z,.02,1);PX=Math.round((r.width-S.w*Z)/2);PY=Math.round((r.height-S.h*Z)/2);applyView();}
function setZoom(z,sx,sy){const r=vpRect();z=clamp(z,.02,32);if(sx==null){sx=r.width/2;sy=r.height/2;}const dx=(sx-PX)/Z,dy=(sy-PY)/Z;Z=z;PX=sx-dx*Z;PY=sy-dy*Z;applyView();}
const zoomIn=()=>setZoom(Z*1.25), zoomOut=()=>setZoom(Z/1.25);
function toDoc(e){const r=vpRect();return{x:(e.clientX-r.left-PX)/Z,y:(e.clientY-r.top-PY)/Z};}
function sizeOverlay(){dpr=window.devicePixelRatio||1;const r=vpRect();ov.width=Math.round(r.width*dpr);ov.height=Math.round(r.height*dpr);}

let rq=false;
function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;doRender();});}
function doRender(){
  vctx.globalAlpha=1;vctx.globalCompositeOperation='source-over';vctx.clearRect(0,0,S.w,S.h);
  for(const l of S.layers){if(!l.visible)continue;vctx.globalAlpha=l.opacity;vctx.globalCompositeOperation=l.blend;vctx.drawImage(l.canvas,0,0);}
  vctx.globalAlpha=1;vctx.globalCompositeOperation='source-over';
}
function composite(bgFill){doRender();const c=mk(S.w,S.h),x=cx(c);if(bgFill){x.fillStyle=bgFill;x.fillRect(0,0,S.w,S.h);}x.drawImage(view,0,0);return c;}

/* ===== selection ===== */
function setSel(c){S.sel=c||null;buildSelPath();drawOverlay();}
function buildSelPath(){
  selPath=null; if(!S.sel)return;
  const w=S.w,h=S.h,d=cx(S.sel).getImageData(0,0,w,h).data,m=new Uint8Array(w*h);let any=false;
  for(let p=0,i=3;p<m.length;p++,i+=4)if(d[i]>127){m[p]=1;any=true;}
  if(!any){S.sel=null;return;}
  const P=new Path2D();
  for(let y=0;y<=h;y++){let run=-1;for(let x=0;x<=w;x++){let e=false;if(x<w){const a=y>0?m[(y-1)*w+x]:0,b=y<h?m[y*w+x]:0;e=a!==b;}if(e){if(run<0)run=x;}else if(run>=0){P.moveTo(run,y);P.lineTo(x,y);run=-1;}}}
  for(let x=0;x<=w;x++){let run=-1;for(let y=0;y<=h;y++){let e=false;if(y<h){const a=x>0?m[y*w+x-1]:0,b=x<w?m[y*w+x]:0;e=a!==b;}if(e){if(run<0)run=y;}else if(run>=0){P.moveTo(x,run);P.lineTo(x,y);run=-1;}}}
  selPath=P;
}
function shapeMask(fn){const c=mk(S.w,S.h),x=cx(c);x.fillStyle='#fff';fn(x);return c;}
function combineSel(mask,mode){
  if(mode==='new'||!S.sel){if(mode==='sub'||mode==='int'){if(!S.sel)return;}return setSel(mask);}
  const c=clone(S.sel),x=cx(c);x.globalCompositeOperation=mode==='add'?'source-over':mode==='sub'?'destination-out':'destination-in';x.drawImage(mask,0,0);setSel(c);
}
function featherMask(c,r){return r>0?blurCanvas(c,r):c;}
function applyMasked(orig,res){
  if(!S.sel)return res;
  const a=clone(orig),ax=cx(a);ax.globalCompositeOperation='destination-out';ax.drawImage(S.sel,0,0);
  const b=clone(res),bx=cx(b);bx.globalCompositeOperation='destination-in';bx.drawImage(S.sel,0,0);
  ax.globalCompositeOperation='lighter';ax.drawImage(b,0,0);return a;
}
function selectAll(){setSel(shapeMask(x=>x.fillRect(0,0,S.w,S.h)));snap('Выделить всё');}
function deselect(){if(!S.sel)return;setSel(null);snap('Снять выделение');}
function invertSel(){const m=shapeMask(x=>x.fillRect(0,0,S.w,S.h));if(S.sel){const x=cx(m);x.globalCompositeOperation='destination-out';x.drawImage(S.sel,0,0);}setSel(m);snap('Инверсия выделения');}
function selectLayer(){const m=clone(AL().canvas),x=cx(m);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,S.w,S.h);setSel(m);if(S.sel)snap('Выделить содержимое слоя');else toast('Слой пустой');}
function featherDialog(){if(!S.sel)return toast('Сначала выделите область (M, L или W)');dialog({title:'Растушевать выделение',desc:'Делает край выделения мягким — правки будут плавно переходить в остальную картинку.',fields:[{id:'r',label:'Радиус, px',type:'range',min:1,max:100,value:10}],onOk:v=>{setSel(blurCanvas(S.sel,v.r));snap('Растушёвка');}});}

/* ===== pixel helpers ===== */
function boxH(s,o,w,h,r){const n=1/(2*r+1);for(let y=0;y<h;y++){const row=y*w*4;let a0=0,a1=0,a2=0,a3=0;for(let k=-r;k<=r;k++){const i=row+Math.min(w-1,Math.max(0,k))*4;a0+=s[i];a1+=s[i+1];a2+=s[i+2];a3+=s[i+3];}for(let x=0;x<w;x++){const j=row+x*4;o[j]=a0*n;o[j+1]=a1*n;o[j+2]=a2*n;o[j+3]=a3*n;const ia=row+Math.min(w-1,x+r+1)*4,ir=row+Math.max(0,x-r)*4;a0+=s[ia]-s[ir];a1+=s[ia+1]-s[ir+1];a2+=s[ia+2]-s[ir+2];a3+=s[ia+3]-s[ir+3];}}}
function boxV(s,o,w,h,r){const n=1/(2*r+1),st=w*4;for(let x=0;x<w;x++){const col=x*4;let a0=0,a1=0,a2=0,a3=0;for(let k=-r;k<=r;k++){const i=col+Math.min(h-1,Math.max(0,k))*st;a0+=s[i];a1+=s[i+1];a2+=s[i+2];a3+=s[i+3];}for(let y=0;y<h;y++){const j=col+y*st;o[j]=a0*n;o[j+1]=a1*n;o[j+2]=a2*n;o[j+3]=a3*n;const ia=col+Math.min(h-1,y+r+1)*st,ir=col+Math.max(0,y-r)*st;a0+=s[ia]-s[ir];a1+=s[ia+1]-s[ir+1];a2+=s[ia+2]-s[ir+2];a3+=s[ia+3]-s[ir+3];}}}
function blurImageData(id,r){r=Math.max(0,Math.round(r));if(!r)return;const{width:w,height:h,data:d}=id;
  for(let i=0;i<d.length;i+=4){const a=d[i+3]/255;d[i]*=a;d[i+1]*=a;d[i+2]*=a;}
  const t=new Uint8ClampedArray(d.length);for(let k=0;k<3;k++){boxH(d,t,w,h,r);boxV(t,d,w,h,r);}
  for(let i=0;i<d.length;i+=4){const a=d[i+3];if(a){const f=255/a;d[i]*=f;d[i+1]*=f;d[i+2]*=f;}}}
function blurCanvas(c,r){const id=cx(c).getImageData(0,0,c.width,c.height);blurImageData(id,r);const n=mk(c.width,c.height);cx(n).putImageData(id,0,0);return n;}
function floodMask(d,w,h,sx,sy,tol,contig){
  sx|=0;sy|=0;const m=new Uint8Array(w*h);if(sx<0||sy<0||sx>=w||sy>=h)return m;
  const i0=(sy*w+sx)*4,r0=d[i0],g0=d[i0+1],b0=d[i0+2],a0=d[i0+3];
  const ok=p=>{const i=p*4;return Math.abs(d[i]-r0)<=tol&&Math.abs(d[i+1]-g0)<=tol&&Math.abs(d[i+2]-b0)<=tol&&Math.abs(d[i+3]-a0)<=tol;};
  if(!contig){for(let p=0;p<w*h;p++)if(ok(p))m[p]=1;return m;}
  const st=[[sx,sy]];
  while(st.length){let[x,y]=st.pop();let p=y*w+x;if(m[p]||!ok(p))continue;
    while(x>0&&!m[p-1]&&ok(p-1)){x--;p--;}
    let up=false,dn=false;
    while(x<w&&!m[p]&&ok(p)){m[p]=1;
      if(y>0){const q=p-w;if(!m[q]&&ok(q)){if(!up){st.push([x,y-1]);up=true;}}else up=false;}
      if(y<h-1){const q=p+w;if(!m[q]&&ok(q)){if(!dn){st.push([x,y+1]);dn=true;}}else dn=false;}
      x++;p++;}}
  return m;
}
function maskCanvas(m,w,h){const c=mk(w,h),x=cx(c),id=x.createImageData(w,h),d=id.data;for(let p=0,i=0;p<m.length;p++,i+=4)if(m[p]){d[i]=d[i+1]=d[i+2]=d[i+3]=255;}x.putImageData(id,0,0);return c;}
function alphaBounds(c){const w=c.width,h=c.height,d=cx(c).getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}return x1<0?null:{x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};}

function buildToolbar(){

    if(t==='sep'){tb.append(el('div',{class:'tsep'}));continue;}

    b.addEventListener('mouseleave',()=>tip.hidden=true);

  }

}
const swapColors=()=>{const a=FG;setFG(BG);setBG(a);};

function setTool(id){

/* ===== brush engine ===== */
const ST={snap:null,stroke:null,tmp:null,src:null,last:null,dirty:null,mode:'',raf:0,on:false};
let lastEnd=null, cloneSrc=null, cloneOff=null;
function buf(name){if(!ST[name]||ST[name].width!==S.w||ST[name].height!==S.h)ST[name]=mk(S.w,S.h);return ST[name];}
function canPaint(){const l=AL();if(!l.visible){toast('Активный слой скрыт — включите «глаз» в панели «Слои»');return false;}return true;}
function dab(c,x,y,size){const r=size/2,h=O.hard;c.beginPath();c.arc(x,y,Math.max(.5,r),0,Math.PI*2);if(h>=.98||r<2){c.fillStyle='#fff';}else{const g=c.createRadialGradient(x,y,r*h,x,y,r);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;}c.fill();}

function strokeBegin(mode,p,e){

const MODE_LABEL={brush:'Кисть',eraser:'Ластик',clone:'Штамп',blur:'Размытие',dodge:'Осветлитель'};

/* ===== shapes, gradient ===== */
function drawShape(c,a,b,shift){

function drawGradient(L,a,b){

}

/* ===== crop ===== */
const crop={rect:null};

function applyCrop(){const r=crop.rect;if(!r||r.w<2||r.h<2)return toast('Сначала обведите рамку инструментом «Кадрирование»');crop.rect=null;

/* ===== text ===== */
const TX={active:false,p:null};
const fontStr=(size)=>`${O.bold?700:400} ${size}px "${O.font}", system-ui, sans-serif`;

textEdit.addEventListener('input',sizeText);

/* ===== pointer ===== */
let drag=null,spaceDown=false,mouse=null,antsT=0;
const ALT_PICK=['brush','fill','gradient','shape','text'];

vp.addEventListener('contextmenu',e=>e.preventDefault());
vp.addEventListener('pointerdown',e=>{
  closeMenus();

  if(e.button===1||spaceDown||tool==='hand'){drag={type:'pan',sx:e.clientX,sy:e.clientY,px:PX,py:PY};vp.style.cursor='grabbing';return;}

    case 'wand':{const src=O.merged?(doRender(),view):l.canvas;const d=cx(src).getImageData(0,0,S.w,S.h).data;const m=floodMask(d,S.w,S.h,p.x,p.y,O.tol,O.contig);if(!m.some(v=>v))return;combineSel(featherMask(maskCanvas(m,S.w,S.h),O.feather),selModeFrom(e));snap('Волшебная палочка');break;}

vp.addEventListener('pointermove',e=>{
  const p=toDoc(e);mouse={x:p.x,y:p.y,sx:e.clientX-vpRect().left,sy:e.clientY-vpRect().top};
  $('#coords').textContent=`x ${Math.floor(p.x)}  y ${Math.floor(p.y)}`;
  if(!drag){drawOverlay();return;}
  switch(drag.type){
    case 'pan':PX=drag.px+e.clientX-drag.sx;PY=drag.py+e.clientY-drag.sy;applyView();return;
    case 'pick':samplePixel(p,drag.bg);break;
    case 'stroke':{const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of(evs.length?evs:[e]))addPoint(toDoc(ev),ev);break;}
    case 'move':{const dx=Math.round(p.x-drag.x0),dy=Math.round(p.y-drag.y0);if(dx===drag.dx&&dy===drag.dy)break;drag.dx=dx;drag.dy=dy;moveRender(drag);break;}
    case 'marq':drag.b=p;break;
    case 'lasso':{const q=drag.pts[drag.pts.length-1];if(Math.hypot(q.x-p.x,q.y-p.y)*Z>2)drag.pts.push(p);break;}
    case 'grad':drag.b=p;if(e.shiftKey){const ang=Math.round(Math.atan2(p.y-drag.a.y,p.x-drag.a.x)/(Math.PI/4))*(Math.PI/4),len=Math.hypot(p.x-drag.a.x,p.y-drag.a.y);drag.b={x:drag.a.x+Math.cos(ang)*len,y:drag.a.y+Math.sin(ang)*len};}drawGradient(cx(AL().canvas),drag.a,drag.b);break;

    case 'crop':crop.rect=constrainCrop(drag.a.x,drag.a.y,p.x,p.y);break;

});
function moveRender(dg){const L=cx(AL().canvas);L.clearRect(0,0,S.w,S.h);if(dg.float){L.drawImage(dg.base,0,0);L.drawImage(dg.float,dg.dx,dg.dy);}else L.drawImage(ST.snap,dg.dx,dg.dy);render();}
function moveCommit(dg){

  if(dg.selStart){const n=mk(S.w,S.h);cx(n).drawImage(dg.selStart,dg.dx,dg.dy);setSel(n);}
  ST.snap=null;snap('Перемещение');

function endDrag(e){

    case 'move':moveCommit(d);break;
    case 'marq':{const w=Math.abs(d.b.x-d.a.x),h=Math.abs(d.b.y-d.a.y);
      if(w*Z<3&&h*Z<3){if(d.mode==='new'&&S.sel)deselect();break;}
      const x=Math.min(d.a.x,d.b.x),y=Math.min(d.a.y,d.b.y);
      combineSel(featherMask(shapeMask(c=>{c.beginPath();O.selShape==='ellipse'?c.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2):c.rect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));c.fill();}),O.feather),d.mode);snap('Выделение');break;}

    case 'shape':if(Math.hypot(d.b.x-d.a.x,d.b.y-d.a.y)*Z<3){if(d.created){S.layers.splice(S.active,1);S.active--;}else AL().canvas=ST.snap;render();updateLayersUI();}else snap('Фигура');ST.snap=null;break;
    case 'crop':if(crop.rect&&(crop.rect.w<2||crop.rect.h<2))crop.rect=null;else toast('Enter — обрезать, Esc — отмена',1800);break;

}
vp.addEventListener('pointerup',endDrag);vp.addEventListener('pointercancel',endDrag);
vp.addEventListener('pointerleave',()=>{if(!drag){mouse=null;drawOverlay();}});
vp.addEventListener('dblclick',()=>{if(tool==='crop'&&crop.rect)applyCrop();});
vp.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaMode===1?33:1;
  if(e.ctrlKey||e.metaKey||e.altKey){const r=vpRect();setZoom(Z*Math.exp(-e.deltaY*k*.0018),e.clientX-r.left,e.clientY-r.top);}
  else if(e.shiftKey&&!e.deltaX){PX-=e.deltaY*k;applyView();}else{PX-=e.deltaX*k;PY-=e.deltaY*k;applyView();}},{passive:false});

/* ===== overlay ===== */

  o.strokeStyle='rgba(0,0,0,.7)';o.lineWidth=1;o.strokeRect(PX-.5,PY-.5,S.w*Z+1,S.h*Z+1);

HOT.push({...parseKey('Shift+U'),run:()=>{const s=OPTS.shape.choices.map(c=>c[0]);O.shape=s[(s.indexOf(O.shape)+1)%s.length];setTool('shape');}});
HOT.push({...parseKey('X'),run:swapColors},{...parseKey('D'),run:defColors});
let openMenu=null;
function buildMenus(){const nav=$('#menus');MENUS.forEach((m,i)=>{const b=el('button',{class:'mbtn',type:'button',text:m.label});b.addEventListener('click',e=>{e.stopPropagation();openMenu===i?closeMenus():showMenu(i,b);});b.addEventListener('mouseenter',()=>{if(openMenu!=null&&openMenu!==i)showMenu(i,b);});nav.append(b);});}
function showMenu(i,b){closeMenus();openMenu=i;b.classList.add('open');const r=b.getBoundingClientRect(),dd=el('div',{class:'dropdown',id:'dd'});
  for(const it of MENUS[i].items){if(it==='-'){dd.append(el('hr'));continue;}if(it.head){dd.append(el('div',{class:'head',text:it.head}));continue;}if(it.hide)continue;
    const btn=el('button',{type:'button'},el('span',{text:it.label}),it.key?el('kbd',{text:fmtKey(it.key)}):null);btn.addEventListener('click',()=>{closeMenus();it.run();});dd.append(btn);}
  document.body.append(dd);dd.style.left=Math.max(8,Math.min(r.left,innerWidth-dd.offsetWidth-8))+'px';dd.style.top=(r.bottom+4)+'px';}
function closeMenus(){const d=$('#dd');d&&d.remove();document.querySelectorAll('.mbtn.open').forEach(b=>b.classList.remove('open'));openMenu=null;}
document.addEventListener('pointerdown',e=>{if(openMenu!=null&&!e.target.closest('#dd,.mbtn'))closeMenus();});

function togglePanels(){if(innerWidth<=900)$('#app').classList.toggle('showpanels');else{$('#app').classList.toggle('nopanels');}requestAnimationFrame(()=>{sizeOverlay();drawOverlay();});}
document.addEventListener('keydown',e=>{
  const t=e.target,tag=t.tagName;
  if(!$('#keys').hidden){if(e.key==='Escape'||e.key==='F1'){e.preventDefault();hideKeys();}return;}
  if(DLG){if(e.key==='Escape'){e.preventDefault();DLG.cancel();}return;}
  if(t===textEdit){if(e.key==='Escape'){e.preventDefault();cancelText();}else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();commitText();}return;}
  if((tag==='INPUT'&&!['range','checkbox','button'].includes(t.type))||tag==='TEXTAREA'||tag==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();if(!spaceDown){spaceDown=true;updateCursor();drawOverlay();}return;}
  if(e.key==='Alt'){e.preventDefault();return;}
  if(e.key==='Escape'){closeMenus();if(crop.rect)cancelCrop();if(drag&&drag.type==='lasso'){drag=null;drawOverlay();}return;}
  if(e.key==='Enter'&&tool==='crop'&&crop.rect){e.preventDefault();applyCrop();return;}
  if(e.key==='F1'||(e.key==='?'&&!e.ctrlKey)){e.preventDefault();showKeys();return;}
  const ctrl=e.ctrlKey||e.metaKey;
  for(const h of HOT){if(h.codes.includes(e.code)&&h.ctrl===ctrl&&h.shift===e.shiftKey&&h.alt===e.altKey){if(h.passive)return;e.preventDefault();if(drag)return;closeMenus();h.run();return;}}
  if(!ctrl&&!e.altKey){
    if(e.code==='BracketLeft'||e.code==='BracketRight'){e.preventDefault();const up=e.code==='BracketRight';if(e.shiftKey)O.hard=clamp(+(O.hard+(up?.1:-.1)).toFixed(2),0,1);else{const s=O.size,st=s<10?1:s<50?5:s<100?10:25;O.size=clamp(up?s+st:s-st,1,500);}buildOpts();drawOverlay();return;}
    const dm=e.code.match(/^(?:Digit|Numpad)(\d)$/);if(dm&&T(tool).opts.includes('opacity')){const n=+dm[1];O.opacity=n===0?1:n/10;buildOpts();toast('Непрозрачность '+pct(O.opacity),900);return;}
    if(tool==='move'&&e.key.startsWith('Arrow')){e.preventDefault();if(!canPaint())return;const st=e.shiftKey?10:1,dx=e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,dy=e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0,l=AL();ST.snap=l.canvas;edit(l);const dg={dx,dy,selStart:S.sel};if(S.sel){const b=clone(ST.snap),f=clone(ST.snap);let x=cx(b);x.globalCompositeOperation='destination-out';x.drawImage(S.sel,0,0);x=cx(f);x.globalCompositeOperation='destination-in';x.drawImage(S.sel,0,0);dg.base=b;dg.float=f;}moveRender(dg);moveCommit(dg);return;}
  }
});
document.addEventListener('keyup',e=>{if(e.code==='Space'){spaceDown=false;updateCursor();drawOverlay();}if(e.key==='Alt')e.preventDefault();});
window.addEventListener('blur',()=>{spaceDown=false;updateCursor();});

const MISC=[['[  ]','Размер кисти меньше / больше'],['Shift+[  ]','Жёсткость кисти'],['1 … 9, 0','Непрозрачность 10…90 %, 0 = 100 %'],['X','Поменять основной и фоновый цвет'],['D','Цвета по умолчанию: чёрный и белый'],['Пробел + тянуть','Рука: двигать холст в любом инструменте'],['Alt + клик','Пипетка во время рисования'],['Alt + клик (Штамп)','Задать источник копирования'],['Shift + клик','Прямая линия кистью от прошлой точки'],['Ctrl + колесо','Масштаб (на тачпаде — щипок)'],['Колесо / Shift + колесо','Прокрутка вверх-вниз / влево-вправо'],['Стрелки (Shift)','Сдвиг слоя на 1 (10) px — инструмент V'],['Shift при выделении','Добавить к выделению'],['Alt при выделении','Вычесть из выделения'],['Ctrl + клик по миниатюре','Выделить содержимое слоя'],['Enter','Применить кадрирование'],['Ctrl+Enter','Закончить надпись'],['Esc','Отмена: кадр, надпись, окно, меню']];
function showKeys(){closeMenus();const g=$('#kgrid');g.innerHTML='';const grp=(title,rows)=>g.append(el('div',{class:'kgroup'},el('h3',{text:title}),...rows.map(([k,d])=>el('div',{class:'krow'},el('span',{text:d}),el('kbd',{text:fmtKey(k)})))));

  MENUS.forEach(m=>{const rows=m.items.filter(i=>i.key&&!i.hide).map(i=>[i.key,i.label.replace(/…$/,'')]);if(rows.length)grp(m.label,rows);});
  grp('Кисть, цвет и навигация',MISC);$('#kfilter').value='';$('#keys').hidden=false;$('#kfilter').focus();}

/* ===== sample ===== */
function makeSample(){
  S.w=1200;S.h=800;const bg=newLayer('Фон'),x=cx(bg.canvas),w=S.w,h=S.h,hz=h*.62;
  let g=x.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#26335c');g.addColorStop(.55,'#b45f74');g.addColorStop(1,'#f3b07c');x.fillStyle=g;x.fillRect(0,0,w,hz);
  const ridge=(base,amp,fr,sd,col)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,hz+2);for(let i=0;i<=w;i+=4){const t=i/w;x.lineTo(i,base-amp*(Math.sin(t*fr+sd)*.5+Math.sin(t*fr*2.3+sd*1.7)*.3+Math.sin(t*fr*5.1+sd*.3)*.2));}x.lineTo(w,hz+2);x.closePath();x.fill();};
  ridge(hz-50,110,5,1,'#7a4f6e');ridge(hz-15,80,7,3,'#4d3557');ridge(hz,40,11,5,'#2c2240');
  g=x.createLinearGradient(0,hz,0,h);g.addColorStop(0,'#d99a7a');g.addColorStop(.3,'#7d5470');g.addColorStop(1,'#1d1a33');x.fillStyle=g;x.fillRect(0,hz,w,h-hz);
  x.fillStyle='#ffd7a3';for(let i=0;i<60;i++){x.globalAlpha=.35*(1-i/70);const yy=hz+6+Math.pow(i/60,1.6)*(h-hz),ww=(1-i/60)*180+20;x.fillRect(w*.62-ww/2+Math.sin(i*1.7)*20,yy,ww,2+i/30);}x.globalAlpha=1;
  const sun=newLayer('Солнце');sun.blend='screen';const sx=cx(sun.canvas);g=sx.createRadialGradient(w*.62,h*.47,0,w*.62,h*.47,w*.28);g.addColorStop(0,'rgba(255,240,200,1)');g.addColorStop(.16,'rgba(255,214,150,.95)');g.addColorStop(.17,'rgba(255,180,120,.42)');g.addColorStop(1,'rgba(255,140,100,0)');sx.fillStyle=g;sx.fillRect(0,0,w,h);
  resetDoc(w,h,[bg,sun],'Пример открыт');S.active=0;updateLayersUI();
}

/* ===== touch: two-finger pinch & pan ===== */
const PTR=new Map();let pinch=null,pinchLock=false;
function abortDrag(){
  if(!drag)return;const d=drag;drag=null;
  if(d.type==='stroke'){if(ST.raf){cancelAnimationFrame(ST.raf);ST.raf=0;}ST.on=false;if(ST.snap)AL().canvas=ST.snap;ST.snap=null;ST.src=null;if(d.flip)O.dodge=O.dodge==='dodge'?'burn':'dodge';}
  else if(d.type==='move'||d.type==='grad'){if(ST.snap)AL().canvas=ST.snap;ST.snap=null;}
  else if(d.type==='shape'){if(d.created){S.layers.splice(S.active,1);S.active--;}else if(ST.snap)AL().canvas=ST.snap;ST.snap=null;updateLayersUI();}
  else if(d.type==='crop')crop.rect=null;
  render();drawOverlay();
}
function pinchGeom(){const r=vpRect(),[a,b]=[...PTR.values()];return{d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top};}
vp.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch')return;
  PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PTR.size===2){abortDrag();const g=pinchGeom();pinch={d0:g.d,z0:Z,dx:(g.mx-PX)/Z,dy:(g.my-PY)/Z};pinchLock=true;mouse=null;}
  if(pinch||pinchLock){e.stopImmediatePropagation();try{vp.setPointerCapture(e.pointerId);}catch(_){}}
},{capture:true});
vp.addEventListener('pointermove',e=>{
  if(e.pointerType!=='touch'||!PTR.has(e.pointerId))return;
  PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&PTR.size>=2){const g=pinchGeom();Z=clamp(pinch.z0*g.d/pinch.d0,.02,32);PX=g.mx-pinch.dx*Z;PY=g.my-pinch.dy*Z;applyView();}
  if(pinch||pinchLock)e.stopImmediatePropagation();
},{capture:true});
const ptrEnd=e=>{
  if(e.pointerType!=='touch')return;PTR.delete(e.pointerId);
  if(PTR.size<2)pinch=null;
  if(pinchLock){e.stopImmediatePropagation();if(!PTR.size)pinchLock=false;}
};
vp.addEventListener('pointerup',ptrEnd,{capture:true});vp.addEventListener('pointercancel',ptrEnd,{capture:true});
